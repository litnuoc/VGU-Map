name: Deploy Nuxt 3 to GitHub Pages

on:
  push:
    branches:
      - OMG # Đổi thành 'master' nếu nhánh chính của bạn tên là master
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update Info Data (Google Sheets → site)"
    types:
      - completed
    branches:
      - OMG

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # For workflow_run events, only proceed if the upstream workflow succeeded.
    # push and workflow_dispatch events skip this check (github.event_name != 'workflow_run').
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, the default ref is the commit that
          # triggered THIS workflow, which may lag behind the data-sync commit.
          # Pinning to the OMG branch head guarantees we always build the latest data.
          ref: OMG

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Đổi thành npx nuxi (CLI chuẩn của Nuxt 3)
      - name: Generate Static HTML
        run: npx nuxi generate

      # [THÊM MỚI] Chốt chặn an toàn: Tắt Jekyll và kiểm tra file
      - name: Fix GitHub Pages requirements and Debug
        run: |
          touch .output/public/.nojekyll
          echo "Danh sách các file chuẩn bị upload:"
          ls -la .output/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
